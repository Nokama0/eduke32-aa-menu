name: release

permissions: {}

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = powershell -File src/ekmod/build.ps1 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'build exited with code ' + $LASTEXITCODE }
          if ($out -notmatch ('(?<!\w)' + [regex]::Escape('0 failed') + '(?!\w)')) { throw 'build output lacks: 0 failed' }
      - name: Write checksum
        shell: bash
        run: (cd "$(dirname build/version.dll)" && sha256sum "$(basename build/version.dll)") > "$(basename build/version.dll).sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/version.dll
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" build/version.dll "$(basename build/version.dll).sha256" --generate-notes

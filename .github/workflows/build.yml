name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = powershell -File src/ekmod/build.ps1 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'build exited with code ' + $LASTEXITCODE }
          if ($out -notmatch ('(?<!\w)' + [regex]::Escape('0 failed') + '(?!\w)')) { throw 'build output lacks: 0 failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eduke32-aa-menu
          path: build/version.dll
          if-no-files-found: error
